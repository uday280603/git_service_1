<div class="card">
  <div class="card-header"></div>
  <div class="card-body">
    <form #productForm="ngForm">
      <div class="form-group">
        <label for="">ProductName</label>
        <input type="text" name="productName" ngModel class="form-control" />
      </div>
      <div class="form-group">
        <label for="price">Price</label>
        <input type="text" name="price" ngModel class="form-control" />
      </div>
      <div class="form-group">
        <label for="category">Category</label>
        <input type="text" name="category" ngModel class="form-control" />
      </div>
      <div class="form-group">
        <label for="description">Description</label>
        <input type="text" name="description" ngModel class="form-control" />
      </div>
      <button *ngIf="!IsinEditMode" class="btn btn-primary btn-block">
        Add Product
      </button>
      <button
        type="button"
        *ngIf="IsinEditMode"
        class="btn btn-success btn-block"
        (click)="updateProduct()"
      >
        Update Product
      </button>
    </form>
  </div>
</div>
