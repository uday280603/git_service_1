<div class="card">
    <div class="card-header">
        <h1>Product CRUD</h1>
    </div>
    <div class="card-body">
        <form #productForm="ngForm"  (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="productName">ProductName*</label>
                <input type="text" required ngModel name="productName" class="form-control">
            </div>
            <div class="form-group">
                <label for="productName">Price*</label>
                <input type="text"  required ngModel name="price" class="form-control">
            </div>
             <div class="form-group">
                <label for="productName">Category*</label>
                <input type="text"  required ngModel name="category" class="form-control">
            </div>
             <div class="form-group">
                <label for="productName">Description*</label>
                <input type="text" required ngModel name="description" class="form-control">
            </div>
            <div class="card-footer">
                <button *ngIf="!isInEditMode" class="btn-block btn-primary">Add Product</button>
                <button *ngIf="isInEditMode" class="btn-block btn-danger"(click)="onUpdate()"  >Update Product</button>
            </div>
        </form>
    </div>
</div>
